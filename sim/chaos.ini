; 混沌模式設定（LegacyApp 啟動時讀取）。也可用環境變數 LEGACYLAB_CHAOS=off|light|heavy 覆寫 level。
[chaos]
; off / light / heavy：決定下面各項的預設值
level=off
; 個別覆寫（取消註解即可）
;delay_min_ms=1000
;delay_max_ms=5000
;popup_prob=0.3
;token_expire_prob=0.3
;focus_steal_prob=0.15
; 模擬不同 DPI：1.0 / 1.25 / 1.5
;dpi_scale=1.25
; 匯出用逗號當小數點、分號當分隔（模擬不同地區設定）
;decimal_comma=1
;seed=42
